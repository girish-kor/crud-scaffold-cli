version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "girish-kor"
    labels:
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # Monitor GitHub Actions for updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    reviewers:
      - "girish-kor"
    labels:
      - "ci"
      - "maintenance"
    commit-message:
      prefix: "ci(actions):"
