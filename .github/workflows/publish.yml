name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create deployment status
        if: success()
        run: |
          echo "Published version: ${{ github.event.release.tag_name }}"
          echo "Package: https://www.npmjs.com/package/crud-scaffold-cli"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Failed to publish to npm"
          exit 1
