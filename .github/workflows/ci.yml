name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  integration:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Node.js scaffolding
        run: npm run dev -- --name test-nodejs --lang nodejs --variant express --db postgresql --no-install

      - name: Test Python scaffolding
        run: npm run dev -- --name test-python --lang python --variant fastapi --db postgresql --no-install

      - name: Test Go scaffolding
        run: npm run dev -- --name test-go --lang go --variant gin --db postgresql --no-install

      - name: Verify generated projects
        run: |
          [ -d "test-nodejs" ] && echo "✓ Node.js project created"
          [ -d "test-python" ] && echo "✓ Python project created"
          [ -d "test-go" ] && echo "✓ Go project created"
